sources:
  npm: true

# Force UTF-8 encoding
encoding: 'utf-8'

# Ignore problematic packages with encoding issues
ignored:
  npm:
    - form-data

allowed:
  - apache-2.0
  - bsd-2-clause
  - bsd-3-clause
  - isc
  - mit
  - cc0-1.0
  - unlicense
  - 0bsd

reviewed:
  npm:
  - sax
  - "@protobuf-ts/plugin-framework" # Apache-2.0
  - "@protobuf-ts/runtime" # Apache-2.0
  - fs.realpath # ISC
  - glob # ISC
  - prettier # MIT
  - lodash # MIT
  - "@actions/http-client" # MIT
  - ieee754 # 1.2.1: BSD-3-Clause LICENSE plus README license notice
  - readable-stream # 3.6.2: MIT Node.js and Joyent license notices
  - string_decoder # 1.3.0: MIT Node.js and Joyent license notices
