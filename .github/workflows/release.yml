name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, for example v5.0.8
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-v5
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/v5
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo '::error::Version tag already exists.'
            exit 1
          fi
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Check package version
        run: node -e 'if (("v" + require("./package.json").version) !== process.env.TAG) process.exit(1)'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm audit --audit-level=high
      - name: Verify distributed artifacts
        run: |
          npm run build
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"
      - name: Package release
        run: |
          set -euo pipefail
          tar -czf "qiniu-actions-cache-${TAG}.tar.gz" action.yml restore/action.yml save/action.yml dist LICENSE .licenses
          sha256sum "qiniu-actions-cache-${TAG}.tar.gz" > SHA256SUMS
      - name: Attest release artifact
        id: attest
        uses: actions/attest@v4.1.0
        with:
          subject-checksums: SHA256SUMS
          create-storage-record: false
      - name: Verify attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION_BUNDLE" provenance.sigstore.json
          gh attestation verify "qiniu-actions-cache-${TAG}.tar.gz" --bundle provenance.sigstore.json --repo "$GITHUB_REPOSITORY" --source-digest "$GITHUB_SHA" --source-ref refs/heads/v5 --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
      - name: Publish release from verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/v5" --jq .object.sha)" = "$GITHUB_SHA"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --generate-notes "qiniu-actions-cache-${TAG}.tar.gz" SHA256SUMS provenance.sigstore.json
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
