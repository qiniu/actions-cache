name: Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - releases/**
      - v5*
  push:
    branches:
      - main
      - releases/**
      - fix/**
      - v4*
      - v5*

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Node 24 tests and bundles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        persist-credentials: false
    - name: Set up Node.js
      uses: actions/setup-node@v6.4.0
      with:
        node-version: 24
        cache: npm
    - name: Install dependencies
      run: npm ci --ignore-scripts
    - name: Type-check and test
      run: npm test -- --runInBand
    - name: Build distributed artifacts
      run: npm run build
    - name: Verify distributed artifacts are current
      run: |
        git diff --exit-code -- dist
        test -z "$(git ls-files --others --exclude-standard -- dist)"

  # RunsOn integration requires dedicated infrastructure; run it manually.
  test-save:
    if: github.event_name == 'workflow_dispatch'
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-arm64/env=bootstrap
    strategy:
      matrix:
        part_size: [32]
        queue_size: [4, 8]
      fail-fast: false
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Generate files in working directory
      shell: bash
      run: |
        __tests__/create-cache-files.sh ${{ runner.os }} test-cache
        dd if=/dev/urandom of=test-cache/random-1gb.bin bs=1M count=1024
    - name: Generate files outside working directory
      shell: bash
      run: __tests__/create-cache-files.sh ${{ runner.os }} ~/test-cache
    - name: Save cache
      uses: ./
      env:
        UPLOAD_PART_SIZE: ${{ matrix.part_size }}
        UPLOAD_QUEUE_SIZE: ${{ matrix.queue_size }}
      with:
        key: test-${{ runner.os }}-${{ github.run_id }}-${{ matrix.part_size }}-${{ matrix.queue_size }}
        path: |
          test-cache
          ~/test-cache
  test-restore:
    needs: test-save
    strategy:
      matrix:
        part_size: [8, 16]
        queue_size: [8, 12]
      fail-fast: false
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-arm64/env=bootstrap
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Restore cache
      uses: ./
      env:
        DOWNLOAD_PART_SIZE: ${{ matrix.part_size }}
        DOWNLOAD_QUEUE_SIZE: ${{ matrix.queue_size }}
      with:
        key: test-${{ runner.os }}-${{ github.run_id }}-${{ matrix.part_size }}-${{ matrix.queue_size }}
        restore-keys: |
          test-${{ runner.os }}-${{ github.run_id }}-${{ matrix.part_size }}-
          test-${{ runner.os }}-${{ github.run_id }}-
        path: |
          test-cache
          ~/test-cache
    - name: Verify cache files in working directory
      shell: bash
      run: __tests__/verify-cache-files.sh ${{ runner.os }} test-cache
    - name: Verify cache files outside working directory
      shell: bash
      run: __tests__/verify-cache-files.sh ${{ runner.os }} ~/test-cache

  test-container:
    if: github.event_name == 'workflow_dispatch'
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-arm64/env=bootstrap
    container:
      image: ubuntu:latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Test in container
      run: |
        __tests__/create-cache-files.sh Linux test-cache
        __tests__/verify-cache-files.sh Linux test-cache
    - name: Save cache
      uses: ./
      with:
        key: test-container-${{ github.run_id }}
        path: test-cache
